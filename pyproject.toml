[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "proofline"
version = "0.0.1"
description = "Video-verified invoices for UK tradespeople"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "jsonschema>=4.17",
    "imageio-ffmpeg>=0.4.9",
    "urllib3<2; python_version < \"3.10\"",  # macOS system Python ships LibreSSL
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
proofline = ["schemas/*.json"]
