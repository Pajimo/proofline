# Trade pack: small domestic plumbing, water side only. No gas work, ever.
# Prices are ILLUSTRATIVE placeholders for the demo. A real tradesperson sets their own.
# Sections: trade + labour (who the agent works for), safety (hard stops, checked before any reply),
# faults (what the agent can triage from a customer video), parts (price list).
pack: plumbing
version: 1
currency: GBP
vat_rate: 0.20          # applied only if the tradesperson is VAT-registered
vat_registered: false

labour:
  rate_per_hour: 60.00
  minimum_hours: 1.0
  increment_hours: 0.25   # bill in 15-minute steps
callout:
  id: callout
  description: Call-out charge
  price: 45.00

trade:
  label: plumber          # used in prompts: "help a UK plumber triage..."
  business_name: Dave's Plumbing
  owner_name: Dave
  # Asked when the video shows nothing this trade can help with.
  nothing_seen_question: >-
    I couldn't spot the problem in that video. What's going wrong? If you can, send a short video
    close up of it, for example the tap, pipe, toilet or boiler pressure gauge.
  area: Manchester
  # Every price the agent drafts carries this wording and goes to the owner first.
  estimate_wording: Estimate, subject to inspection.

# Never quoted or advised on. Lines matching them are blocked, not flagged.
excluded:
  - id: gas_safe_record
    reason: Gas work and Gas Safe records need a registered Gas Safe engineer.
    keywords: [gas, gas safe, cp12, landlord gas safety, flue, burner, pilot light]
  - id: electrical_certificate
    reason: Electrical certificates (EIC, MWC, EICR) need a qualified electrician.
    keywords: [eicr, minor works certificate, electrical installation certificate, consumer unit, fuse board]

# Jobs this pack covers (day-1 invoice pipeline). The pipeline uses them to frame the extraction prompt.
jobs:
  - id: tap_cartridge
    name: Replace tap cartridge
    typical_minutes: 45
    expected_parts: [ceramic_cartridge, o_ring_kit]
    steps: [isolate water, remove handle, unscrew cartridge, fit new cartridge, reassemble, test for leaks]
  - id: toilet_fill_valve
    name: Replace toilet fill valve
    typical_minutes: 60
    expected_parts: [fill_valve, flexible_connector]
    steps: [isolate water, flush and empty cistern, disconnect supply, remove old valve, fit new valve, set water level, test]
  - id: radiator_valve
    name: Replace radiator valve
    typical_minutes: 75
    expected_parts: [radiator_valve, ptfe_tape, inhibitor]
    steps: [isolate radiator, drain down, remove old valve, fit new valve, refill, bleed, check for leaks]
  - id: radiator_bleed
    name: Bleed radiators and top up pressure
    typical_minutes: 30
    expected_parts: []
    steps: [bleed each radiator, check boiler pressure gauge, top up via filling loop]

